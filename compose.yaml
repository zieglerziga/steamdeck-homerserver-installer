name: arr-server

x-arr-environment: &arr-environment
  PUID: ${ARR_UID:?set ARR_UID in .env}
  PGID: ${MEDIA_GID:?set MEDIA_GID in .env}
  TZ: ${TZ:?set TZ in .env}
  UMASK: "002"

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - arr

services:
  radarr:
    <<: *service-defaults
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls315@sha256:95ba0801df4d9d1d79d0d9a3849f656542497dab061d91b87ad4f53a71aff3ef
    environment: *arr-environment
    volumes:
      - /srv/arr/config/radarr:/config
      - /srv/arr/data:/data
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:7878:7878/tcp"

  sonarr:
    <<: *service-defaults
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls323@sha256:4d9df314875e1249ab7d6170c2b9b3dc1d8e6383f168ceb10dc9a5ad9b324739
    environment: *arr-environment
    volumes:
      - /srv/arr/config/sonarr:/config
      - /srv/arr/data:/data
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:8989:8989/tcp"

  prowlarr:
    <<: *service-defaults
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls158@sha256:91844fa2c927ad6ede5630127183cc7868b175f6223e83e6a5da1fffea2aa782
    environment: *arr-environment
    volumes:
      - /srv/arr/config/prowlarr:/config
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:9696:9696/tcp"

  qbittorrent:
    <<: *service-defaults
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls475@sha256:8d48fa8c619caadfb103f04efea8747e2a2762d6c7551690919cffb987e61cee
    environment:
      <<: *arr-environment
      WEBUI_PORT: "8080"
      TORRENTING_PORT: ${QBITTORRENT_PEER_PORT:-6881}
    volumes:
      - /srv/arr/config/qbittorrent:/config
      - /srv/arr/data:/data
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:8080:8080/tcp"
      - "${LAN_IP:?set LAN_IP in .env}:${QBITTORRENT_PEER_PORT:-6881}:${QBITTORRENT_PEER_PORT:-6881}/tcp"
      - "${LAN_IP:?set LAN_IP in .env}:${QBITTORRENT_PEER_PORT:-6881}:${QBITTORRENT_PEER_PORT:-6881}/udp"

  jellyfin:
    <<: *service-defaults
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2604-ls47@sha256:438e44330078e6b1a810fdec9dc0f4773e6595edb137c5eb4417a516da4c7f0e
    environment: *arr-environment
    volumes:
      - /srv/arr/config/jellyfin:/config
      - /srv/arr/data/library:/data/library:ro
    ports:
      - "${LAN_IP:?set LAN_IP in .env}:8096:8096/tcp"

networks:
  arr:
    driver: bridge
    enable_ipv6: false

